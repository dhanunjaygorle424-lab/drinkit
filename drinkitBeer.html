<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DrinkIt Beer</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #0b1220;
            --surface: #142039;
            --surface-soft: #1c2a46;
            --text: #f8fafc;
            --muted: #94a3b8;
            --accent: #fbbf24;
            --accent-strong: #fb7185;
            --border: rgba(255,255,255,0.1);
            --shadow: 0 24px 60px rgba(0,0,0,0.25);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Inter, Arial, sans-serif;
            background: radial-gradient(circle at top, #1f2937 0%, #0b1220 55%);
            color: var(--text);
            min-height: 100vh;
        }
        .page-shell {
            max-width: 1160px;
            margin: 0 auto;
            padding: 24px;
        }
        header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
            padding: 18px 20px;
            border: 1px solid var(--border);
            border-radius: 24px;
            background: rgba(15,23,42,0.92);
            box-shadow: var(--shadow);
            margin-bottom: 28px;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .brand .mark {
            width: 48px;
            height: 48px;
            display: grid;
            place-items: center;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--accent), var(--accent-strong));
            color: #0f172a;
            font-weight: 700;
            font-size: 1.2rem;
        }
        .brand h1 {
            margin: 0;
            font-size: 1.4rem;
        }
        nav a {
            color: var(--text);
            text-decoration: none;
            margin-right: 18px;
            font-weight: 600;
        }
        nav a:last-child { margin-right: 0; }
        .search-row {
            width: 100%;
            max-width: 420px;
        }
        .search-row input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(255,255,255,0.05);
            color: var(--text);
            font-size: 1rem;
        }
        .hero {
            display: grid;
            gap: 18px;
            margin-bottom: 24px;
        }
        .hero h2 {
            margin: 0;
            font-size: clamp(2rem, 3.5vw, 3rem);
        }
        .hero p {
            margin: 0;
            max-width: 780px;
            line-height: 1.8;
            color: var(--muted);
        }
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 22px;
        }
        .product-card {
            background: linear-gradient(180deg, rgba(15,23,42,0.9), rgba(15,23,42,0.98));
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
        }
        .product-card img {
            width: 100%;
            aspect-ratio: 4 / 3;
            object-fit: cover;
        }
        .product-card .details {
            padding: 18px;
            display: grid;
            gap: 12px;
            flex: 1;
        }
        .product-card h3 {
            margin: 0;
            font-size: 1.2rem;
        }
        .product-card p {
            margin: 0;
            color: var(--muted);
            line-height: 1.7;
        }
        .price-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-top: 10px;
        }
        .price {
            color: var(--accent);
            font-weight: 700;
            font-size: 1.2rem;
        }
        .card-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 14px;
        }
        .card-actions button {
            border: none;
            border-radius: 14px;
            padding: 12px 14px;
            font-weight: 700;
            cursor: pointer;
        }
        .order-btn { background: #22c55e; color: #071b13; }
        .cart-btn { background: rgba(255,255,255,0.08); color: var(--text); }
        .category-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 16px 0;
        }
        .category-buttons button {
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(255,255,255,0.05);
            color: var(--text);
            padding: 10px 18px;
            border-radius: 14px;
            cursor: pointer;
            font-weight: 600;
        }
        .category-buttons button.active,
        .category-buttons button:hover {
            background: linear-gradient(135deg, var(--accent), var(--accent-strong));
            color: #0f172a;
            border-color: transparent;
        }
        footer {
            margin-top: 30px;
            text-align: center;
            color: var(--muted);
        }
        @media (max-width: 720px) {
            header { flex-direction: column; align-items: stretch; }
            .card-actions { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="page-shell">
        <header>
            <div class="brand">
                <span class="mark">B</span>
                <div>
                    <h1>DrinkIt</h1>
                    <small style="color: var(--muted);">Search and shop beers, whiskies & wines.</small>
                </div>
            </div>
            <nav>
                <a href="index.html">Home</a>
                <a href="drinkit-cart.html">Cart</a>
                <a href="drinkit-login.html">Login</a>
            </nav>
            <div class="search-row">
                <input id="searchInput" type="search" placeholder="Search drinks...">
            </div>
        </header>

        <section class="hero">
            <h2>Drinks for Every Mood</h2>
            <p>Browse premium beers, smooth whiskies, and rich wines. Use the search bar to filter your favorite bottles instantly.</p>
            <div class="category-buttons">
                <button type="button" data-category="all" class="active">All</button>
                <button type="button" data-category="beer">Beers</button>
                <button type="button" data-category="whisky">Whiskies</button>
                <button type="button" data-category="wine">Wines</button>
            </div>
        </section>

        <section class="product-grid" id="beerCatalog"></section>

        <footer>DrinkIt catalog · Search by drink name · Add your favorites to cart or order directly.</footer>
    </div>

        const products = [
            ...beerNames.map((name, index) => ({
                name,
                category: 'beer',
                price: 120 + index * 11,
                description: beerDescriptions[index] || 'Fresh and crisp with layered malt notes and a smooth finish.',
                image: beerImages[index % beerImages.length]
            })),
            ...whiskyNames.map((name, index) => ({
                name,
                category: 'whisky',
                price: 260 + index * 16,
                description: 'Smooth, rich, and balanced with mellow oak and warm spice.',
                image: whiskyImages[index % whiskyImages.length]
            })),
            ...wineNames.map((name, index) => ({
                name,
                category: 'wine',
                price: 900 + index * 25,
                description: 'Elegant and layered with fruit richness and a silky finish.',
                image: wineImages[index % wineImages.length]
            }))
        ];

        const catalog = document.getElementById('beerCatalog');
        let currentCategory = 'all';

        function renderProducts() {
            catalog.innerHTML = '';
            products.forEach(product => {
                const card = document.createElement('article');
                card.className = 'product-card';
                card.dataset.name = product.name;
                card.dataset.price = product.price;
                card.dataset.category = product.category;

                card.innerHTML = `
                    <img src="${product.image}" alt="${product.name}">
                    <div class="details">
                        <h3>${product.name}</h3>
                        <p>${product.description}</p>
                        <div class="price-row">
                            <span class="price">₹${product.price}</span>
                        </div>
                        <div class="card-actions">
                            <button class="order-btn">Order Now</button>
                            <button class="cart-btn">Add to Cart</button>
                        </div>
                    </div>
                `;
                catalog.appendChild(card);
            });
            filterProducts();
        }

        document.querySelectorAll('.category-buttons button').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.category-buttons button').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentCategory = btn.dataset.category;
                filterProducts();
            });
        });

        const searchInput = document.getElementById('searchInput');
        if (searchInput) {
            searchInput.addEventListener('input', filterProducts);
        }

        function filterProducts() {
            const query = searchInput ? searchInput.value.trim().toLowerCase() : '';
            document.querySelectorAll('.product-card').forEach(card => {
                const name = card.dataset.name.toLowerCase();
                const category = card.dataset.category;
                const matchesSearch = name.includes(query);
                const matchesCategory = currentCategory === 'all' || category === currentCategory;
                card.style.display = (matchesSearch && matchesCategory) ? '' : 'none';
            });
        }

        renderProducts();
    </script>
    <script src="script.js"></script>
</body>
</html>
