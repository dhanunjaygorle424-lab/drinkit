<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment | DrinkIt</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(circle at top, #1d4ed8 0%, #0f172a 70%);
            color: #f8fafc;
            font-family: Inter, Arial, sans-serif;
            padding: 24px;
        }
        .page-shell {
            max-width: 980px;
            margin: 0 auto;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            gap: 18px;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
        }
        .brand .mark {
            display: inline-grid;
            place-items: center;
            width: 42px;
            height: 42px;
            border-radius: 14px;
            background: #fb7185;
            color: #0f172a;
            font-size: 1.2rem;
        }
        nav {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
        }
        nav a {
            color: #f8fafc;
            text-decoration: none;
            font-weight: 600;
        }
        .content {
            display: grid;
            grid-template-columns: 1.1fr 0.85fr;
            gap: 24px;
        }
        .panel {
            background: rgba(15, 23, 42, 0.94);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 26px;
            padding: 28px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.25);
        }
        h1, h2 {
            margin-top: 0;
        }
        .checkout-line {
            display: flex;
            justify-content: space-between;
            margin: 12px 0;
            color: #cbd5e1;
        }
        .checkout-line.total {
            color: #f8fafc;
            font-weight: 700;
            border-top: 1px solid rgba(255,255,255,0.08);
            padding-top: 12px;
        }
        .input-grid {
            display: grid;
            gap: 18px;
        }
        label {
            display: block;
            color: #cbd5e1;
            margin-bottom: 8px;
        }
        input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.04);
            color: #f8fafc;
            font-size: 1rem;
        }
        .small-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
        }
        button {
            border: none;
            border-radius: 16px;
            padding: 16px 18px;
            background: linear-gradient(135deg, #fbbf24, #fb7185);
            color: #071022;
            font-weight: 700;
            cursor: pointer;
        }
        .message {
            margin-top: 18px;
            padding: 16px 18px;
            border-radius: 16px;
            font-weight: 600;
        }
        .message.error {
            background: rgba(239, 68, 68, 0.12);
            color: #fee2e2;
        }
        .message.success {
            background: rgba(34, 197, 94, 0.12);
            color: #dcfce7;
        }
        .detect-btn {
            margin-top: 12px;
            background: rgba(255,255,255,0.08);
            color: #f8fafc;
            border: none;
            border-radius: 14px;
            padding: 12px 16px;
            cursor: pointer;
            transition: background 0.2s ease;
        }
        .detect-btn:hover {
            background: rgba(255,255,255,0.14);
        }
        .location-message {
            margin-top: 12px;
            font-size: 0.95rem;
            color: #94a3b8;
        }
        .map-container {
            margin-top: 18px;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.12);
            min-height: 260px;
            background: #0f172a;
        }
        .map-container iframe {
            width: 100%;
            height: 100%;
            border: 0;
            min-height: 260px;
        }
        .empty-cart {
            padding: 24px;
            background: rgba(255,255,255,0.04);
            border-radius: 18px;
            color: #94a3b8;
        }
        @media (max-width: 860px) {
            .content { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="page-shell">
        <div class="top-bar">
            <div class="brand">
                <span class="mark">D</span>
                <span>DrinkIt</span>
            </div>
            <nav id="main-nav"></nav>
        </div>
        <div class="content">
            <section class="panel">
                <h1>Secure payment</h1>
                <p>Complete your order with fast checkout. Your payment details are validated in the browser to simulate a real gateway.</p>
                <div id="payment-summary"></div>
            </section>
            <section class="panel">
                <h2>Payment details</h2>
                <form id="payment-form">
                    <div class="input-grid">
                        <div>
                            <label for="fullName">Full name</label>
                            <input type="text" id="fullName" required>
                        </div>
                        <div>
                            <label for="email">Email address</label>
                            <input type="email" id="email" required>
                        </div>
                        <div>
                            <label for="location">Delivery location</label>
                            <input type="text" id="location" placeholder="Use current location or enter address" required>
                            <button type="button" class="detect-btn" id="detect-location">Use current location</button>
                            <div id="location-status" class="location-message"></div>
                            <div class="map-container">
                                <iframe id="location-map" src="https://maps.google.com/maps?q=India&z=5&output=embed" allowfullscreen></iframe>
                            </div>
                        </div>
                        <div>
                            <label for="cardNumber">Card number</label>
                            <input type="text" id="cardNumber" inputmode="numeric" placeholder="1234 5678 9012 3456" required>
                        </div>
                        <div class="small-grid">
                            <div>
                                <label for="expiry">Expiry</label>
                                <input type="text" id="expiry" placeholder="MM/YY" required>
                            </div>
                            <div>
                                <label for="cvv">CVV</label>
                                <input type="text" id="cvv" inputmode="numeric" placeholder="123" required>
                            </div>
                        </div>
                    </div>
                    <div style="margin-top: 18px; font-size: 0.95rem; color: #94a3b8;">Total payment amount: <strong id="payAmount">₹0.00</strong></div>
                    <button type="submit">Pay now</button>
                    <div id="payment-message"></div>
                </form>
            </section>
        </div>
    </div>
    <script src="storage.js"></script>
    <script src="script.js"></script>
</body>
</html>
