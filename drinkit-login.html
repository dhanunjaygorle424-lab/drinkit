<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | DrinkIt</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(circle at top, #1d4ed8, #0f172a);
            color: #f8fafc;
            font-family: Inter, Arial, sans-serif;
            display: grid;
            place-items: center;
            padding: 24px;
        }
        .page-shell {
            width: min(520px, 100%);
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
        }
        .brand .mark {
            display: inline-grid;
            place-items: center;
            width: 42px;
            height: 42px;
            border-radius: 14px;
            background: #fb7185;
            color: #0f172a;
            font-size: 1.2rem;
        }
        nav {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
        }
        nav a {
            color: #f8fafc;
            text-decoration: none;
            font-weight: 600;
        }
        .card {
            background: rgba(15, 23, 42, 0.92);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.2);
        }
        h1 {
            margin-top: 0;
            font-size: 2rem;
        }
        label {
            display: block;
            margin: 18px 0 8px;
            color: #cbd5e1;
        }
        input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.04);
            color: #f8fafc;
            font-size: 1rem;
        }
        button {
            width: 100%;
            margin-top: 24px;
            border: none;
            border-radius: 14px;
            padding: 14px 16px;
            background: linear-gradient(135deg, #fbbf24, #fb7185);
            color: #071022;
            font-weight: 700;
            cursor: pointer;
        }
        .footer {
            margin-top: 18px;
            color: #94a3b8;
            font-size: 0.95rem;
            text-align: center;
        }
        .footer a {
            color: #f8fafc;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="page-shell">
        <div class="top-bar">
            <div class="brand">
                <span class="mark">D</span>
                <span>DrinkIt</span>
            </div>
            <nav id="main-nav"></nav>
        </div>
        <div class="card">
            <h1>Login to DrinkIt</h1>
            <form id="loginForm">
                <label for="email">Email address</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required>

                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>

                <button type="submit">Login</button>
            </form>
            <div class="footer">
                Don’t have an account? <a href="drinkitR.html">Register</a>
            </div>
        </div>
    </div>
    <script src="storage.js"></script>
    <script src="script.js"></script>
</body>
</html>
