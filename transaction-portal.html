<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transaction Portal | DrinkIt</title>
    <style>
        body {
            margin: 0;
            font-family: Inter, Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #f8fafc;
            min-height: 100vh;
            padding: 24px;
        }
        .wrap { max-width: 900px; margin: 0 auto; }
        .card { background: rgba(15,23,42,0.95); border:1px solid rgba(255,255,255,0.08); border-radius:24px; padding:24px; box-shadow:0 20px 60px rgba(0,0,0,0.25); }
        .row { display:grid; gap:14px; margin-top:14px; }
        input, button { width:100%; padding:14px 16px; border-radius:14px; border:1px solid rgba(255,255,255,0.08); font-size:1rem; }
        input { background: rgba(255,255,255,0.04); color:#f8fafc; }
        button { background: linear-gradient(135deg, #fbbf24, #fb7185); color:#071022; font-weight:700; cursor:pointer; border:none; }
        .message { margin-top:14px; padding:12px 14px; border-radius:14px; }
        .success { background: rgba(34,197,94,0.2); color:#dcfce7; }
        .error { background: rgba(239,68,68,0.2); color:#fee2e2; }
        a { color:#f8fafc; text-decoration:none; }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="card">
            <h1>Transaction Portal</h1>
            <p>Record a payment transaction and save it locally for the admin view.</p>
            <a href="admin-portal.html">Open Admin Portal</a>
            <form id="txn-form">
                <div class="row">
                    <input type="text" id="customerName" placeholder="Customer name" required />
                    <input type="email" id="email" placeholder="Customer email" required />
                    <input type="text" id="amount" placeholder="Amount" required />
                    <input type="text" id="items" placeholder="Items (e.g. 2× Corona, 1× Heineken)" required />
                </div>
                <button type="submit" style="margin-top:14px;">Save transaction</button>
            </form>
            <div id="txn-message"></div>
        </div>
    </div>
    <script src="storage.js"></script>
    <script src="script.js"></script>
    <script>
        const storage = window.DrinkItStorage;
        document.getElementById('txn-form').addEventListener('submit', function (event) {
            event.preventDefault();
            const customerName = document.getElementById('customerName').value.trim();
            const email = document.getElementById('email').value.trim();
            const amount = document.getElementById('amount').value.trim();
            const itemsText = document.getElementById('items').value.trim();
            const message = document.getElementById('txn-message');

            if (!customerName || !email || !amount || !itemsText) {
                message.className = 'message error';
                message.textContent = 'Please fill all fields.';
                return;
            }

            const items = itemsText.split(',').map(item => {
                const trimmed = item.trim();
                const match = trimmed.match(/(\d+)×\s*(.+)/i);
                if (match) {
                    return { qty: Number(match[1]), name: match[2].trim() };
                }
                return { qty: 1, name: trimmed };
            });

            const transaction = {
                id: Date.now(),
                customerName,
                email,
                amount,
                items,
                date: new Date().toLocaleString()
            };

            storage.addTransaction(transaction);
            message.className = 'message success';
            message.textContent = 'Transaction saved successfully.';
            this.reset();
        });
    </script>
</body>
</html>
